<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Splash sizing preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#f7c948;font-family:-apple-system,sans-serif;display:flex;gap:20px;justify-content:center;padding:30px 20px;flex-wrap:wrap}
  .phone{width:300px;height:620px;border-radius:36px;border:6px solid #1a1300;overflow:hidden;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
  .label{width:300px;text-align:center;color:#c6b07a;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .before img{width:100%;height:100%;object-fit:cover}
  .after img{width:70%;max-width:240px;height:auto;object-fit:contain}
  h1{width:100%;text-align:center;font-family:'Cinzel',serif;color:#f7c948;margin-bottom:20px;font-size:22px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet"></head>
<body>
<h1>Splash logo sizing — before vs after</h1>
<div>
  <div class="label">Before (too big)</div>
  <div class="phone before"><img src="/assets/splash-frame.jpg"></div>
</div>
<div>
  <div class="label">After (cinematic)</div>
  <div class="phone after"><img src="/assets/splash-frame.jpg"></div>
</div>
</body></html>
