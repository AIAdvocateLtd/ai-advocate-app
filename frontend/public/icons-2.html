<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 2 — Gold Coin Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#f7c948; --gold-deep:#d6a017; --gold-soft:#fde68a; --bg:#050505; --bg-card:#131313; --line:#2a2218; --text:#fefdf8; --text-dim:#c9bfa6; --text-muted:#8a8270; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
.shell { max-width: 420px; margin: 0 auto; padding: 18px 16px 100px; }
.brand { font-family: 'Cinzel', serif; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.topbar .greet { font-size: 13px; color: var(--text-muted); }
.topbar .greet b { color: var(--gold); font-weight: 500; }
.icons { display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
.logo-wrap { display: flex; justify-content: center; margin: 4px 0 14px; }
.logo-wrap img { width: 200px; mix-blend-mode: screen; }
.trial { background: linear-gradient(90deg, rgba(247,201,72,0.12), rgba(247,201,72,0.02)); border: 1px solid rgba(247,201,72,0.3); color: var(--gold-soft); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 14px; min-height: 110px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; }

/* THE GOLD COIN */
.coin {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(247,201,72,0.25) 0%, rgba(247,201,72,0.10) 50%, transparent 80%);
  border: 1px solid rgba(247,201,72,0.4);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 rgba(247,201,72,0.25), 0 2px 8px rgba(0,0,0,0.3);
}
.coin svg { color: var(--gold); width: 22px; height: 22px; stroke-width: 1.75; }

.tile .lbl { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.25; }
.tile .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.callout { position: fixed; top: 18px; right: 18px; background: var(--gold); color: #1a1300; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; z-index: 100; }

/* Bottom nav (same as Option A) */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: rgba(8,8,8,0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 8px 14px; display: flex; justify-content: space-around; align-items: center; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; cursor: pointer; padding: 4px; }
.nav-item svg { color: var(--text-muted); width: 20px; height: 20px; }
.nav-item .lbl { font-size: 10px; color: var(--text-muted); }
.nav-item.active svg, .nav-item.active .lbl { color: var(--gold); }
.lex-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #f7c948, #d6a017); margin-top: -22px; cursor: pointer; overflow: hidden; border: 3px solid #000; box-shadow: 0 4px 22px rgba(247,201,72,0.45); }
.lex-btn img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
.lex-label { font-size: 10px; color: var(--gold); margin-top: 2px; font-weight: 600; font-family: 'Cinzel', serif; letter-spacing: 0.05em; }
</style>
</head>

    <div class="tile"><div class="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></div><div class="lbl">Snap Evidence</div></div>

    <div class="tile"><div class="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><div class="lbl">Immigration & Expat</div></div>
    <div class="tile"><div class="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div><div class="lbl">Employment Law</div></div>

    <div class="tile"><div class="coin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.3.3 0 1 0 .2.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg></div><div class="lbl">Medical Negligence</div></div>
  </div>
</div>
