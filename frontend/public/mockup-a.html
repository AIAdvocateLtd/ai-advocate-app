<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option A — Bottom Nav</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#f7c948; --gold-deep:#d6a017; --gold-soft:#fde68a; --bg:#050505; --bg-card:#131313; --line:#2a2218; --text:#fefdf8; --text-dim:#c9bfa6; --text-muted:#8a8270; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
.shell { max-width: 420px; margin: 0 auto; padding: 18px 16px 90px; position: relative; min-height: 100vh; }
.brand { font-family: 'Cinzel', serif; }

/* Top bar */
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.topbar .greet { font-size: 13px; color: var(--text-muted); }
.topbar .greet b { color: var(--gold); font-weight: 500; }
.topbar .icons { display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }

/* Logo */
.logo-wrap { display: flex; justify-content: center; margin: 4px 0 12px; }
.logo-wrap img { width: 200px; mix-blend-mode: screen; }

/* Trial banner */
.trial { background: linear-gradient(90deg, rgba(247,201,72,0.12), rgba(247,201,72,0.02)); border: 1px solid rgba(247,201,72,0.3); color: var(--gold-soft); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; }

/* Tile grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 12px; min-height: 96px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.tile:hover { border-color: var(--gold); }
.tile .ico { color: var(--gold); font-size: 22px; }
.tile .lbl { font-size: 14px; color: var(--text); line-height: 1.25; }

/* Bottom nav */
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 420px; background: rgba(8,8,8,0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 10px 12px 14px; display: flex; justify-content: space-around; align-items: center; z-index: 50; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex: 1; min-width: 0; }
.nav-item .ico { color: var(--text-muted); font-size: 20px; }
.nav-item .lbl { font-size: 10px; color: var(--text-muted); }
.nav-item.active .ico, .nav-item.active .lbl { color: var(--gold); }
.lex-btn { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #f7c948, #d6a017); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 22px rgba(247,201,72,0.45); margin-top: -22px; cursor: pointer; overflow: hidden; border: 3px solid #000; }
.lex-btn img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }
.lex-label { font-size: 10px; color: var(--gold); margin-top: 2px; font-weight: 600; }

.callout { position: fixed; top: 18px; right: 18px; background: var(--gold); color: #1a1300; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; z-index: 100; }
</style>
</head>
<body>
<div class="callout">Option A — Bottom Nav</div>
<div class="shell">
  <div class="topbar">
    <div class="greet">Hi, <b>Test User</b></div>
    <div class="icons">
      <button class="icon-btn">⚙</button>
      <button class="icon-btn">🇬🇧</button>
      <button class="icon-btn">⤴</button>
    </div>
  </div>
  <div class="logo-wrap"><img src="/assets/logo.jpg" alt=""></div>
  <div class="trial">13 days left in free trial</div>
  <div class="grid">
    <div class="tile"><span class="ico">💬</span><span class="lbl">Ask Lex</span></div>
    <div class="tile"><span class="ico">🎤</span><span class="lbl">Record Legal Interaction</span></div>
    <div class="tile"><span class="ico">📷</span><span class="lbl">Snap Evidence</span></div>
    <div class="tile"><span class="ico">🏛️</span><span class="lbl">Find a Lawyer</span></div>
    <div class="tile"><span class="ico">📁</span><span class="lbl">My Legal Files</span></div>
    <div class="tile"><span class="ico">📄</span><span class="lbl">Generate Legal Letter</span></div>
    <div class="tile"><span class="ico">⚖️</span><span class="lbl">Court Prep</span></div>
    <div class="tile"><span class="ico">🌍</span><span class="lbl">Immigration & Expat Help</span></div>
    <div class="tile"><span class="ico">💼</span><span class="lbl">Employment Law</span></div>
    <div class="tile"><span class="ico">🏠</span><span class="lbl">Property Law</span></div>
    <div class="tile"><span class="ico">🩺</span><span class="lbl">Medical Negligence</span></div>
  </div>
</div>
<nav class="nav">
  <div class="nav-item active"><span class="ico">🏠</span><span class="lbl">Home</span></div>
  <div class="nav-item"><span class="ico">📁</span><span class="lbl">Files</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
    <div class="lex-btn"><img src="/assets/lex.jpg" alt="Lex"></div>
    <div class="lex-label">LEX</div>
  </div>
  <div class="nav-item"><span class="ico">🏛️</span><span class="lbl">Lawyers</span></div>
  <div class="nav-item"><span class="ico">⚙</span><span class="lbl">Settings</span></div>
</nav>
</body>
</html>
