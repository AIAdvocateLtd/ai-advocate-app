<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option C — Categorised Tabs</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root { --gold:#f7c948; --gold-deep:#d6a017; --gold-soft:#fde68a; --bg:#050505; --bg-card:#131313; --line:#2a2218; --text:#fefdf8; --text-dim:#c9bfa6; --text-muted:#8a8270; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }
.shell { max-width: 420px; margin: 0 auto; padding: 18px 16px 100px; position: relative; min-height: 100vh; }
.brand { font-family: 'Cinzel', serif; }

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.topbar .greet { font-size: 13px; color: var(--text-muted); }
.topbar .greet b { color: var(--gold); font-weight: 500; }
.topbar .icons { display: flex; gap: 8px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }

.logo-wrap { display: flex; justify-content: center; margin: 4px 0 14px; }
.logo-wrap img { width: 170px; mix-blend-mode: screen; }

.trial { background: linear-gradient(90deg, rgba(247,201,72,0.12), rgba(247,201,72,0.02)); border: 1px solid rgba(247,201,72,0.3); color: var(--gold-soft); padding: 10px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; }

/* Tabs */
.tabs { display: flex; gap: 6px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
.tab { flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; font-size: 13px; color: var(--text-muted); cursor: pointer; font-weight: 500; transition: all 200ms; }
.tab.active { background: var(--gold); color: #1a1300; }

/* Tile grid (compact) */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 14px; min-height: 100px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.tile:hover { border-color: var(--gold); }
.tile .ico { color: var(--gold); font-size: 24px; }
.tile .lbl { font-size: 14px; color: var(--text); line-height: 1.25; font-weight: 500; }
.tile .sub { font-size: 11px; color: var(--text-muted); }

/* Floating Lex */
.lex-float { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--gold); background: #000; overflow: hidden; box-shadow: 0 4px 22px rgba(247,201,72,0.45); cursor: pointer; }
.lex-float img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: screen; }

.callout { position: fixed; top: 18px; right: 18px; background: var(--gold); color: #1a1300; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; z-index: 100; }
</style>
</head>
<body>
<div class="callout">Option C — Tabs</div>
<div class="shell">
  <div class="topbar">
    <div class="greet">Hi, <b>Test User</b></div>
    <div class="icons">
      <button class="icon-btn">⚙</button>
      <button class="icon-btn">🇬🇧</button>
      <button class="icon-btn">⤴</button>
    </div>
  </div>
  <div class="logo-wrap"><img src="/assets/logo.jpg" alt=""></div>
  <div class="trial">13 days left in free trial</div>

  <div class="tabs">
    <div class="tab active">Get Advice</div>
    <div class="tab">Tools</div>
    <div class="tab">Help</div>
  </div>

  <div class="grid">
    <div class="tile"><span class="ico">💬</span><div class="lbl">Ask Lex</div><div class="sub">General legal chat</div></div>
    <div class="tile"><span class="ico">⚖️</span><div class="lbl">Court Prep</div><div class="sub">Police & court</div></div>
    <div class="tile"><span class="ico">💼</span><div class="lbl">Employment</div><div class="sub">Work disputes</div></div>
    <div class="tile"><span class="ico">🏠</span><div class="lbl">Property</div><div class="sub">Tenancy & sale</div></div>
    <div class="tile"><span class="ico">🌍</span><div class="lbl">Immigration</div><div class="sub">Visas & residency</div></div>
    <div class="tile"><span class="ico">🩺</span><div class="lbl">Medical</div><div class="sub">Negligence claims</div></div>
  </div>
</div>
<div class="lex-float"><img src="/assets/lex.jpg" alt="Lex"></div>
</body>
</html>
