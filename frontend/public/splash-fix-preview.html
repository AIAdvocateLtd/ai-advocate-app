<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Splash v3 — Static + Breathing</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; color:#fff; font-family:-apple-system,system-ui,sans-serif; overflow:hidden; }
  .stage {
    position:fixed; inset:0; background:#000;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  @keyframes aaSplashBreath {
    0%, 100% {
      transform: scale(1.0);
      filter: brightness(1.05) contrast(1.45) saturate(1.05)
              drop-shadow(0 0 18px rgba(247,201,72,0.18));
    }
    50% {
      transform: scale(1.035);
      filter: brightness(1.15) contrast(1.5) saturate(1.15)
              drop-shadow(0 0 32px rgba(247,201,72,0.45));
    }
  }
  .splash-logo {
    width: min(70vmin, 480px);
    height: min(70vmin, 480px);
    object-fit: contain;
    display: block;
    -webkit-mask-image: radial-gradient(ellipse 60% 60% at center, #000 55%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0) 95%);
    mask-image: radial-gradient(ellipse 60% 60% at center, #000 55%, rgba(0,0,0,0.5) 75%, rgba(0,0,0,0) 95%);
    animation: aaSplashBreath 2.4s ease-in-out infinite;
    will-change: transform, filter;
    user-select: none;
  }
  .label {
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    color:#f7c948; font-size:11px; letter-spacing:.15em;
    font-family:'Cinzel',serif; z-index:10; opacity:.7;
  }
</style>
</head>
<body>
  <div class="label">SPLASH v3 — Static + Breathing (no flicker)</div>
  <div class="stage">
    <img class="splash-logo" src="/assets/splash-midframe.jpg" alt="AI Advocate" draggable="false" />
  </div>
</body>
</html>
