<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Splash blend preview</title>
<style>
  body{margin:0;background:#000;color:#f7c948;font-family:-apple-system,sans-serif;display:flex;gap:24px;justify-content:center;padding:30px 20px;flex-wrap:wrap}
  .phone{width:300px;height:620px;border-radius:36px;border:6px solid #1a1300;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
  .lbl{width:300px;text-align:center;color:#c6b07a;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .before img{width:70%;object-fit:contain}
  .after img{width:70%;object-fit:contain;mix-blend-mode:screen}
  h1{width:100%;text-align:center;font-family:'Cinzel',serif;margin-bottom:20px;font-size:22px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet"></head>
<body>
<h1>Splash blend — before vs after</h1>
<div>
  <div class="lbl">Before · visible black box</div>
  <div class="phone before"><img src="/assets/splash-frame.jpg"></div>
</div>
<div>
  <div class="lbl">After · floats free (mix-blend: screen)</div>
  <div class="phone after"><img src="/assets/splash-frame.jpg"></div>
</div>
</body></html>
