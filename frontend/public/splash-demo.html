<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI Advocate — Splash → Sign-in Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #f7c948;
    --gold-deep: #b8860b;
    --gold-soft: #e6b539;
    --text: #f5e9c8;
    --text-dim: #c6b07a;
    --text-muted: #7a6c4a;
    --bg-card: #0f0c06;
    --line: #2a2418;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #000; color: var(--text); height: 100%; font-family: -apple-system, Segoe UI, sans-serif; overflow: hidden; }

  /* ----- Splash overlay ----- */
  #splash {
    position: fixed; inset: 0;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    opacity: 1;
    transition: opacity 0.9s ease-out;
  }
  #splash.fade-out { opacity: 0; pointer-events: none; }
  #splash video {
    width: 70vw; max-width: 480px; height: auto;
    object-fit: contain;
  }

  /* ----- Sign-in screen (matches the real app) ----- */
  #signin {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at top, #1a1300 0%, #000 60%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.9s ease-in;
  }
  #signin.show { opacity: 1; }

  .signin-logo {
    width: 160px; height: 160px; margin-bottom: 18px;
    background-image: url('/assets/logo.jpg');
    background-size: contain; background-position: center; background-repeat: no-repeat;
    border-radius: 12px;
  }

  .input {
    width: 100%; max-width: 380px;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 16px;
    color: var(--text); font-size: 15px;
    margin-bottom: 10px;
  }
  .input::placeholder { color: var(--text-muted); }

  .btn-gold {
    width: 100%; max-width: 380px;
    background: var(--gold); color: #1a1300;
    border: none; border-radius: 12px;
    padding: 14px; font-weight: 700; font-size: 15px;
    cursor: pointer; margin-top: 6px;
    box-shadow: 0 0 20px rgba(247,201,72,0.35);
  }

  .or-divider {
    color: var(--text-muted); font-size: 13px; margin: 18px 0 12px;
  }

  .btn-ghost {
    width: 100%; max-width: 380px;
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold-deep); border-radius: 12px;
    padding: 12px; font-weight: 600; font-size: 14px;
    cursor: pointer; margin-bottom: 8px;
  }

  .signup-link {
    color: var(--text-dim); font-size: 13px; margin-top: 20px;
  }
  .signup-link a { color: var(--gold); text-decoration: none; font-weight: 600; }

  /* ----- Replay button on the sign-in screen ----- */
  .replay-btn {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    background: rgba(247,201,72,0.08);
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 12px; cursor: pointer;
    backdrop-filter: blur(6px);
    z-index: 20;
  }
</style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash">
  <video id="splash-video" autoplay muted playsinline>
    <source src="https://customer-assets.emergentagent.com/job_ai-law-guide-1/artifacts/t90zijgp__users_dfe1df40-a1cc-49ce-8b69-028a55df92b0_generated_98f128e7-0cd3-4e55-8870-a54ed7e46727_generated_video.mp4" type="video/mp4">
  </video>
</div>

<!-- ===== SIGN-IN SCREEN ===== -->
<div id="signin">
  <div class="signin-logo"></div>
  <input class="input" placeholder="Email" />
  <input class="input" type="password" placeholder="Password" />
  <button class="btn-gold">Sign In</button>
  <div class="or-divider">— or —</div>
  <button class="btn-ghost">Continue with Google</button>
  <button class="btn-ghost" style="background:#000; color:#fff; border:1px solid #333;">Sign in with Apple</button>
  <p class="signup-link">Don't have an account? <a href="#">Sign Up</a></p>
</div>

<button class="replay-btn" id="replay" style="display:none;" onclick="replay()">↻ Replay splash</button>

<script>
  const splash = document.getElementById('splash');
  const signin = document.getElementById('signin');
  const replayBtn = document.getElementById('replay');
  const video = document.getElementById('splash-video');

  function startFlow() {
    splash.classList.remove('fade-out');
    signin.classList.remove('show');
    replayBtn.style.display = 'none';
    video.currentTime = 0;
    video.play().catch(()=>{});
  }

  function endSplash() {
    splash.classList.add('fade-out');
    setTimeout(() => signin.classList.add('show'), 200);
    setTimeout(() => { replayBtn.style.display = 'block'; }, 1200);
  }

  // Hard cap at 3.5s in case the source video is longer
  video.addEventListener('ended', endSplash);
  setTimeout(endSplash, 3500);

  function replay() { startFlow(); }
  startFlow();
</script>

</body>
</html>
